<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#050507" />
    <title>Page not found | Rexzy</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      @font-face { font-family: 'Inter'; font-weight: 100 900; font-display: swap; src: url('/fonts/inter-latin-wght-normal.woff2') format('woff2'); }
      @font-face { font-family: 'JetBrains Mono'; font-weight: 100 800; font-display: swap; src: url('/fonts/jetbrains-mono-latin-wght-normal.woff2') format('woff2'); }
      * { box-sizing: border-box; margin: 0; }
      html { background: #050507; color-scheme: dark; }
      body { min-height: 100vh; display: grid; place-items: center; padding: 2rem 1.5rem; color: #ededf3; font-family: Inter, system-ui, sans-serif; line-height: 1.65; }
      main { max-width: 34rem; }
      .code { font: 500 0.75rem/1.4 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.1em; text-transform: uppercase; color: #8c8c9b; }
      h1 { margin-top: 1rem; font-size: clamp(2rem, 8vw, 3rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.1; }
      p { margin-top: 1rem; color: #a8a8b7; }
      a { display: inline-block; margin-top: 2rem; padding: 0.7rem 1.4rem; border-radius: 9999px; background: #5266eb; color: #fff; font-weight: 500; text-decoration: none; }
      a:hover { background: #4456d6; }
      a:focus-visible { outline: 2px solid #9aa6ff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404 · Not found</p>
      <h1>That page does not exist.</h1>
      <p>The address may be mistyped, or the page has moved. Everything lives on the home page.</p>
      <a href="/">Back to rexzy.dev</a>
    </main>
  </body>
</html>
